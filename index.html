<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <select id="skin-select" class="skin-select" aria-label="Tema visual">
      <option value="retro">Retro</option>
      <option value="neon">Neón</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel</option>
    </select>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>
        <div class="panel-section b2b-badge hidden" id="b2b-badge">
          <span>B2B ACTIVO (1.5x)</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section rec-section" id="records-section">
          <span class="label">RECORDS</span>
          <div id="records-body"></div>
          <button id="records-reset" class="rec-reset" type="button">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="rec-overlay hidden">
          <div id="overlay-records-body"></div>
          <form id="record-form" class="rec-form hidden">
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button type="submit">Guardar</button>
          </form>
        </div>
        <button id="restart-btn">Reiniciar</button>
        <div id="pause-menu" class="pause-menu hidden">
          <div id="pause-main" class="pause-list">
            <button id="pause-resume-btn" class="pause-btn">Reanudar</button>
            <button id="pause-restart-btn" class="pause-btn">Reiniciar</button>
            <button id="pause-controls-btn" class="pause-btn">Ver controles</button>
            <label class="pause-level">
              <span>Nivel inicial</span>
              <select id="pause-start-level" class="pause-select">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label>
          </div>
          <div id="pause-keys" class="pause-list hidden">
            <ul class="pause-keys-list">
              <li><kbd>←</kbd><kbd>→</kbd> mover</li>
              <li><kbd>↑</kbd> rotar</li>
              <li><kbd>↓</kbd> bajar</li>
              <li><kbd>Space</kbd> caída</li>
              <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
            </ul>
            <button id="pause-keys-back" class="pause-btn">Volver</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
